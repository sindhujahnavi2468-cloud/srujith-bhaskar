<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Quote — Srujith Bhaskar Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:
#1C96C5;--sky:
#63C1E5;--sky-l:
#A0D8EF;--soft:
#D0ECF8;--cream:
#EAF6FC;--ink:
#12303D;--mute:
#4C7B8C;--line:rgba(28,150,197,.18);--dark:
#0B2431;--sw:310px;}
html{scroll-behavior:smooth;}
body{font-family:'Bitter',serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.6;}
button,input,textarea{font-family:inherit;}
.hd{position:sticky;top:0;z-index:50;height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);}
.hd img{height:40px;width:auto;}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);transition:.3s;}
.dot.done{background:var(--sky-l);}
.dot.on{background:var(--blue);transform:scale(1.35);}
.lay{display:grid;grid-template-columns:1fr var(--sw);align-items:start;min-height:calc(100vh - 72px);}
.lay.intro{grid-template-columns:1fr;}
.main{padding:0 48px 130px;max-width:900px;}
.panel{padding:56px 0 40px;animation:in .35s cubic-bezier(.4,0,.2,1) both;}
@keyframes in{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:none;}}
h1,h2{font-weight:900;color:var(--blue);line-height:1.12;letter-spacing:-.01em;}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:10px;}
.sub{font-style:italic;color:var(--mute);font-size:17px;margin-bottom:36px;}
.intro-box{max-width:620px;padding:90px 0 40px;}
.intro-box h1{font-size:clamp(34px,5vw,54px);margin-bottom:18px;}
.intro-box p{font-style:italic;color:var(--mute);font-size:18px;margin-bottom:34px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:34px;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:170px;padding:24px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:700;text-align:center;line-height:1.35;transition:.22s;}
.card:hover{border-color:var(--sky);transform:translateY(-3px);}
.card:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
.card svg{width:56px;height:56px;color:var(--blue);transition:.22s;}
.card.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 26px rgba(28,150,197,.35);}
.card.on svg{color:#fff;}
.card.on::after{content:'';position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#fff;}
.card.on::before{content:'';position:absolute;top:17px;right:17px;width:8px;height:4px;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(-45deg);z-index:1;}
.val{color:
#c0392b;font-size:14px;min-height:22px;margin-bottom:10px;}
.nav{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
.btn{display:inline-flex;align-items:center;gap:10px;border:none;cursor:pointer;border-radius:100px;padding:16px 40px;font-weight:700;font-size:14px;color:var(--dark);background:linear-gradient(135deg,var(--sky-l),var(--sky) 55%,var(--blue));box-shadow:0 6px 22px rgba(99,193,229,.5);transition:.25s;}
.btn:hover{transform:translateY(-2px);}
.btn svg{width:20px;height:20px;}
.prev{background:none;border:none;color:var(--mute);font-size:14px;cursor:pointer;}
.prev:hover{color:var(--blue);}
.prev::before{content:'← ';}
.side{position:sticky;top:72px;background:#fff;border-left:1px solid var(--line);padding:40px 28px;min-height:calc(100vh - 72px);max-height:calc(100vh - 72px);overflow-y:auto;}
.lay.intro .side{display:none;}
.side h3{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:18px;}
.grp{padding:12px 0;border-bottom:1px solid var(--line);}
.grp b{display:block;color:var(--blue);font-size:14px;margin-bottom:4px;}
.grp span{display:block;font-size:13px;color:var(--mute);line-height:1.5;}
.empty{font-style:italic;color:var(--mute);font-size:14px;}
.tot{margin-top:20px;font-size:14px;color:var(--mute);}
.tot b{color:var(--blue);font-size:30px;font-weight:900;margin-right:6px;}
.mob{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:14px 24px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);color:var(--mute);font-size:14px;}
.mob b{color:var(--blue);font-size:20px;margin-right:6px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:8px;}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px;}
input,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;color:var(--ink);outline:none;margin-bottom:16px;}
input:focus,textarea:focus{border-color:var(--blue);}
textarea{min-height:90px;resize:vertical;}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 22px;margin:14px 0 28px;}
@media(max-width:900px){.lay{grid-template-columns:1fr;}.side{display:none;}.mob{display:block;}.main{padding:0 22px 130px;}.hd{padding:0 20px;}.dots{display:none;}}
@media(max-width:540px){.fg{grid-template-columns:1fr;}.grid{grid-template-columns:repeat(2,1fr);gap:12px;}.card{min-height:150px;}}
@media(prefers-reduced-motion:reduce){.panel{animation:none;}}
</style>
</head>
<body>
<header class="hd">
  <a href="/"><img src="https://res.cloudinary.com/nqapapkj/image/upload/v1790169518/logo_black_1_kflgkz.png" alt="Srujith Bhaskar Studios"></a>
  <div class="dots" id="dots"></div>
</header>
<div class="lay intro" id="lay">
  <main class="main" id="panel"></main>
  <aside class="side"><h3>Your package</h3><div id="side"></div></aside>
</div>
<div class="mob" id="mob" style="display:none"></div>

<script>
const WA='918520008666';
const P={
camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
candid:'<circle cx="12" cy="12" r="9"/><path d="M12 3l4 7M20 8l-8 1M19 17l-6-5M12 21l-4-7M4 16l8-1M5 7l6 5"/>',
cine:'<path d="M3 10h18v10H3zM3 10l2-5h14l-1 5M8 5l-2 5M13 5l-2 5M18 5l-2 5"/>',
drone:'<circle cx="12" cy="12" r="2"/><path d="M10.5 10.5L6.5 6.5M13.5 10.5l4-4M10.5 13.5l-4 4M13.5 13.5l4 4"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>',
reel:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/>',
album:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>',
spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
tv:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
live:'<circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9M4.5 4.5a10 10 0 000 15M19.5 4.5a10 10 0 010 15"/>',
heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
moon:'<path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/>',
flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 5a3 3 0 010 6M18 14a6 6 0 013 6"/>',
chat:'<path d="M21 12a9 9 0 01-13.4 7.8L3 21l1.3-4.4A9 9 0 1121 12z"/>'
};
const ic=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+P[k]+'</svg>';
const TP=['camera','Traditional Photography'],TV=['video','Traditional Videography'],CP=['candid','Candid Photography'],CV=['cine','Candid Videography (Cinematic)'],DR=['drone','Drone'];
const S=[
['Pre-Wedding Events','image',[['camera','Pre-Wedding Photoshoot'],['music','Pre-Wedding Song Shoot (Cinematic)'],DR,['reel','Save The Date Reel']]],
['Engagement','heart',[TP,TV,CP,['cine','Candid Video'],DR]],
['Pellikuthuru (Bride-Making)','spark',[TP,TV,CP]],
['Pellikoduku (Groom-Making)','spark',[TP,TV,CP]],
['Bride Haldi','spark',[TP,TV,CP,CV,DR]],
['Groom Haldi','spark',[TP,TV,CP,CV,DR]],
['Couples Haldi (Bride & Groom)','heart',[TP,TV,CP,CV,DR]],
['Mehandi','spark',[TP,TV,CP,['cine','Candid Videography']]],
['Bachelor Party','music',[TP,TV,CP,CV]],
['Sangeet','music',[TP,TV,CP,CV,DR]],
['Rituals','flame',[['flame','Veerabadruni Sambaram'],['flame','Kala Gorlu'],['flame','Kashi Yatra'],['flame','Homam'],['flame','Appaginthalu']]],
['Wedding','heart',[TP,TV,CP,CV,DR,['users','Extra Camera (Audience Coverage)']]],
['Reception','users',[TP,TV,CP,CV,DR]],
['Vratam','flame',[TP,TV]],
['Add-ons','spark',[['tv','LED Wall / Live Display'],['live','Live Streaming (YouTube / Private Link)'],['heart','Couples Grand Entrance Setup'],['print','Instant Photo Printing Booth']]],
['1st Night','moon',[TP,TV]],
['Post-Wedding Events','image',[['camera','Post Wedding Photoshoot'],['music','Post Wedding Song']]],
['Deliverables','album',[['album','Album'],['reel','Instagram Reels'],['bolt','Same Day Delivery (Cinematic Promos)'],['bolt','Same Day Delivery (Edited Photos)']]]
];
const ADD=14,DEL=17;
const evs=new Set(),sel=new Set(),fv={nm:'',ph:'',rq:''};
let idx=-1;
const steps=()=>['pick',...[...evs].sort((a,b)=>a-b),ADD,DEL,'final'];
const active=si=>si===ADD||si===DEL||evs.has(si);
const groups=()=>S.map((s,si)=>[si,s]).filter(([si])=>active(si)).map(([si,s])=>[s[0],s[2].filter((_,ii)=>sel.has(si+'-'+ii)).map(x=>x[1])]).filter(g=>g[1].length);
const count=()=>groups().reduce((n,g)=>n+g[1].length,0);
const card=(k,i,l,on)=>'<button type="button" class="card'+(on?' on':'')+'" data-k="'+k+'" aria-pressed="'+on+'">'+ic(i)+'<span>'+l+'</span></button>';
const panel=document.getElementById('panel');

function render(){
  const st=steps(),cur=idx<0?'intro':st[idx];
  document.getElementById('lay').classList.toggle('intro',idx<0);
  let h='';
  if(cur==='intro'){
    h='<div class="intro-box"><h1>Build your wedding package</h1><p>Choose the events and services you need. We will send your selections to our team on WhatsApp and get back to you with a custom quote.</p><button class="btn" id="go">Get started</button></div>';
  }else if(cur==='pick'){
    h='<h2>Which events are you planning?</h2><p class="sub">Choose all that apply. We will ask about each one next.</p><div class="grid">'+
      S.map((s,si)=>si===ADD||si===DEL?'':card('e'+si,s[1],s[0],evs.has(si))).join('')+'</div>';
  }else if(cur==='final'){
    h='<h2>Almost there</h2><p class="sub">Add your details and send your package to us on WhatsApp.</p><div class="fg"><div><label for="nm">Your name *</label><input id="nm" placeholder="Full name" value="'+fv.nm+'"></div><div><label for="ph">Phone number *</label><input id="ph" type="tel" placeholder="+91 XXXXX XXXXX" value="'+fv.ph+'"></div></div><label for="rq">Any other requirements?</label><textarea id="rq" placeholder="Tell us about anything else you need">'+fv.rq+'</textarea><h3 style="color:var(--blue);font-weight:900">Your selections</h3><div class="sum">'+
      (groups().map(g=>'<div class="grp"><b>'+g[0]+'</b><span>'+g[1].join(', ')+'</span></div>').join('')||'<p class="empty" style="padding:12px 0">Nothing selected yet.</p>')+'</div>';
  }else{
    const s=S[cur],opt=cur===ADD||cur===DEL;
    h='<h2>'+s[0]+'</h2><p class="sub">'+(opt?'Optional. Skip this step if you do not need it.':'Select everything you would like covered.')+'</p><div class="grid">'+s[2].map(([k,l],ii)=>card(cur+'-'+ii,k,l,sel.has(cur+'-'+ii))).join('')+'</div>';
  }
  if(cur!=='intro'){
    h+='<p class="val" id="val" role="alert"></p><div class="nav">'+
      (cur==='final'?'<button class="btn" id="send">'+ic('chat')+'Send on WhatsApp</button>':'<button class="btn" id="nx">Next step</button>')+
      '<button class="prev" id="pv">Previous step</button></div>';
  }
  panel.innerHTML='<div class="panel">'+h+'</div>';
  const d=document.getElementById('dots');
  d.innerHTML=idx<0?'':st.map((_,i)=>'<div class="dot'+(i<idx?' done':i===idx?' on':'')+'"></div>').join('');
  side();window.scrollTo({top:0,behavior:'smooth'});
}
function side(){
  const g=groups(),n=count();
  document.getElementById('side').innerHTML=(g.length?g.map(x=>'<div class="grp"><b>'+x[0]+'</b><span>'+x[1].join(', ')+'</span></div>').join(''):'<p class="empty">Your selections will appear here.</p>')+'<p class="tot"><b>'+n+'</b>services selected</p>';
  const m=document.getElementById('mob');m.style.display=idx<0?'none':'';m.innerHTML='<b>'+n+'</b>services selected';
}
const val=t=>{const v=document.getElementById('val');if(v){v.textContent=t;}};
panel.addEventListener('click',e=>{
  if(e.target.closest('#go')){idx=0;render();return;}
  const c=e.target.closest('.card');
  if(c){const k=c.dataset.k;
    if(k[0]==='e'){const n=+k.slice(1);evs.has(n)?evs.delete(n):evs.add(n);}
    else sel.has(k)?sel.delete(k):sel.add(k);
    const on=c.classList.toggle('on');c.setAttribute('aria-pressed',on);side();val('');return;}
  if(e.target.closest('#pv')){idx--;if(idx<0)idx=0;render();return;}
  if(e.target.closest('#nx')){
    const cur=steps()[idx];
    const ok=cur==='pick'?evs.size:(cur===ADD||cur===DEL)?true:S[cur][2].some((_,ii)=>sel.has(cur+'-'+ii));
    if(!ok){val(cur==='pick'?'Please choose at least one event.':'Please select at least one option.');return;}
    idx++;render();return;}
  if(e.target.closest('#send'))send();
});
panel.addEventListener('input',e=>{if(e.target.id in fv)fv[e.target.id]=e.target.value;});
function send(){
  const nm=fv.nm.trim(),ph=fv.ph.trim();
  if(!nm||!ph){val('Please enter your name and phone number.');return;}
  if(!count()&&!fv.rq.trim()){val('Please go back and select at least one service.');return;}
  let m='Hi Srujith Bhaskar Studios! I would like a quote for my wedding package.\n\n*Name:* '+nm+'\n*Phone:* '+ph+'\n';
  groups().forEach(g=>{m+='\n*'+g[0]+'*\n'+g[1].map(x=>'• '+x).join('\n')+'\n';});
  if(fv.rq.trim())m+='\n*Other requirements:*\n'+fv.rq.trim()+'\n';
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');
}
render();
</script>
</body>
</html>
